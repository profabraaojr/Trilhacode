name: Release

# Ao publicar uma release no GitHub (tag vX.Y.Z), gera as imagens da API e da
# interface/sandbox e as publica no GitHub Container Registry deste repositório.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v1.0.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  imagens:
    name: Publicar imagens no ghcr.io
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: trilhacode-api
            dockerfile: docker/api.Dockerfile
          - image: trilhacode-web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # o nome do repositório no ghcr.io precisa estar em minúsculas
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
