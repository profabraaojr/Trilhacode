# Serviços de apoio para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trilhacode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trilhacode_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trilhacode}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trilhacode} -d ${POSTGRES_DB:-trilhacode}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # interface web
volumes:
  pgdata:
