<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Roteiro de aula prática</title>
  </head>
  <body>
    <h1>Roteiro: montagem de um circuito com LED</h1>
    <ul>
      <li>Protoboard</li>
      <li>
        Resistores
        <ul>
          <li>220 ohms</li>
          <li>330 ohms</li>
        </ul>
      </li>
      <li>LED vermelho</li>
    </ul>
    <ol>
      <li>Encaixe o LED na protoboard.</li>
      <li>Ligue o resistor em série com o LED.</li>
      <li>Conecte a fonte de 5 V.</li>
    </ol>
    <img
      src="circuito.png"
      alt="Esquema do LED ligado em série com um resistor de 220 ohms"
      width="400"
      height="300"
    />
  </body>
</html>
