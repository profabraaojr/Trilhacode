<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TrilhaCode: plataforma educacional de programação de código aberto."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TrilhaCode</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar o "flash" de tema errado.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('tc:theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>A TrilhaCode precisa de JavaScript habilitado no navegador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
