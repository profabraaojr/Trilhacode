# TrilhaCode em produção: banco, API e interface/sandbox atrás do Caddy (HTTPS automático).
# Guia: docs/06-implantacao.md
#   cp .env.prod.example .env.prod   # e preencha
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: trilhacode

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trilhacode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: trilhacode
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trilhacode -d trilhacode']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/profabraaojr/trilhacode-api:${TRILHACODE_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trilhacode:${POSTGRES_PASSWORD}@db:5432/trilhacode
      WEB_ORIGIN: ${TRILHACODE_URL:?defina TRILHACODE_URL}
      PUBLIC_URL: ${TRILHACODE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET (32+ caracteres)}
      SMTP_HOST: ${SMTP_HOST:?defina o servidor SMTP}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}

  web:
    image: ghcr.io/profabraaojr/trilhacode-web:${TRILHACODE_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      TRILHACODE_URL: ${TRILHACODE_URL}
      TRILHACODE_SANDBOX_URL: ${TRILHACODE_SANDBOX_URL:?defina TRILHACODE_SANDBOX_URL}
      TRILHACODE_INSTITUTION: ${TRILHACODE_INSTITUTION:-}
      TRILHACODE_PRIVACY_CONTACT: ${TRILHACODE_PRIVACY_CONTACT:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
